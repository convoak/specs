  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // ===== Theme Functions =====
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      
      if (isDark) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      
      updateMenuThemeStatus();
      // Reinitialize icons after theme change
      lucide.createIcons();
    }

    function updateMenuThemeStatus() {
      const themeStatus = document.getElementById('menu-theme-status');
      const isDark = document.documentElement.classList.contains('dark');
      if (themeStatus) {
        themeStatus.textContent = isDark ? 'On' : 'Off';
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
      updateMenuThemeStatus();
    }

    // ===== Menu Overlay Functions =====
    function openMenu() {
      const overlay = document.getElementById('menu-overlay');
      overlay.classList.remove('-translate-x-full');
      overlay.classList.add('translate-x-0');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      const overlay = document.getElementById('menu-overlay');
      overlay.classList.remove('translate-x-0');
      overlay.classList.add('-translate-x-full');
      document.body.style.overflow = '';
    }

    // Close menu on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });

    // ===== User Avatar Functions =====
    function generateRandomGradient() {
      const colors = [
        '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
        '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B500', '#6C5CE7',
        '#A29BFE', '#FD79A8', '#FDCB6E', '#6C5CE7', '#00B894',
        '#00CEC9', '#0984E3', '#B2BEC3', '#DFE6E9', '#74B9FF'
      ];
      
      const color1 = colors[Math.floor(Math.random() * colors.length)];
      let color2 = colors[Math.floor(Math.random() * colors.length)];
      
      while (color2 === color1) {
        color2 = colors[Math.floor(Math.random() * colors.length)];
      }
      
      const angle = Math.floor(Math.random() * 360);
      return `linear-gradient(${angle}deg, ${color1}, ${color2})`;
    }

    // ===== Desktop Search Functions =====
    function handleDesktopInput(input) {
      const clearBtn = document.getElementById('desktop-clear-btn');
      const randomizeBtn = document.getElementById('desktop-randomize-btn');
      if (input.value.length > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.classList.add('flex');
        randomizeBtn.classList.add('hidden');
        randomizeBtn.classList.remove('flex');
      } else {
        clearBtn.classList.add('hidden');
        clearBtn.classList.remove('flex');
        randomizeBtn.classList.remove('hidden');
        randomizeBtn.classList.add('flex');
      }
    }

    function clearDesktopSearch() {
      const input = document.getElementById('desktop-search-input');
      const clearBtn = document.getElementById('desktop-clear-btn');
      const randomizeBtn = document.getElementById('desktop-randomize-btn');
      input.value = '';
      clearBtn.classList.add('hidden');
      clearBtn.classList.remove('flex');
      randomizeBtn.classList.remove('hidden');
      randomizeBtn.classList.add('flex');
      input.focus();
    }

    function randomizeDesktopSearch() {
      const queries = [
        "What's the best pizza place nearby?",
        "How do I learn to code?",
        "Where can I watch the sunset?",
        "What's a good book to read?",
        "How to make sourdough bread?",
        "Best coffee shops in town",
        "Fun activities for the weekend",
        "How to stay productive?"
      ];
      const input = document.getElementById('desktop-search-input');
      const randomQuery = queries[Math.floor(Math.random() * queries.length)];
      input.value = randomQuery;
      handleDesktopInput(input);
      input.focus();
    }

    // ===== Mobile Search Functions =====
    function openMobileSearch() {
      const modal = document.getElementById('mobile-search-modal');
      const input = document.getElementById('mobile-search-input');
      modal.classList.remove('-translate-y-full');
      modal.classList.add('translate-y-0');
      document.body.style.overflow = 'hidden';
      // Auto-focus input immediately
      setTimeout(() => input.focus(), 50);
    }

    function closeMobileSearch() {
      const modal = document.getElementById('mobile-search-modal');
      modal.classList.remove('translate-y-0');
      modal.classList.add('-translate-y-full');
      document.body.style.overflow = '';
    }

    function handleMobileInput(input) {
      const clearBtn = document.getElementById('mobile-clear-btn');
      const randomizeBtn = document.getElementById('mobile-randomize-btn');
      if (input.value.length > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.classList.add('flex');
        randomizeBtn.classList.add('hidden');
        randomizeBtn.classList.remove('flex');
      } else {
        clearBtn.classList.add('hidden');
        clearBtn.classList.remove('flex');
        randomizeBtn.classList.remove('hidden');
        randomizeBtn.classList.add('flex');
      }
    }

    function clearMobileSearch() {
      const input = document.getElementById('mobile-search-input');
      const clearBtn = document.getElementById('mobile-clear-btn');
      const randomizeBtn = document.getElementById('mobile-randomize-btn');
      input.value = '';
      clearBtn.classList.add('hidden');
      clearBtn.classList.remove('flex');
      randomizeBtn.classList.remove('hidden');
      randomizeBtn.classList.add('flex');
      input.focus();
    }

    function randomizeMobileSearch() {
      const queries = [
        "What's the best pizza place nearby?",
        "How do I learn to code?",
        "Where can I watch the sunset?",
        "What's a good book to read?",
        "How to make sourdough bread?",
        "Best coffee shops in town",
        "Fun activities for the weekend",
        "How to stay productive?"
      ];
      const input = document.getElementById('mobile-search-input');
      const randomQuery = queries[Math.floor(Math.random() * queries.length)];
      input.value = randomQuery;
      handleMobileInput(input);
      input.focus();
    }

    // ===== Initialize =====
    initializeTheme();

    // Initialize avatars with random gradients
    const desktopAvatar = document.getElementById('user-avatar-desktop');
    const mobileAvatar = document.getElementById('user-avatar-mobile');
    const gradient = generateRandomGradient();
    
    desktopAvatar.style.background = gradient;
    mobileAvatar.style.background = gradient;

    // Desktop sign-in toggle
    const signinBtnDesktop = document.getElementById('signin-btn-desktop');
    const userAvatarDesktop = document.getElementById('user-avatar-desktop');
    
    signinBtnDesktop.addEventListener('click', () => {
      signinBtnDesktop.classList.add('hidden');
      userAvatarDesktop.classList.remove('hidden');
    });
    
    userAvatarDesktop.addEventListener('click', () => {
      userAvatarDesktop.classList.add('hidden');
      signinBtnDesktop.classList.remove('hidden');
    });
    
    userAvatarDesktop.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        userAvatarDesktop.classList.add('hidden');
        signinBtnDesktop.classList.remove('hidden');
      }
    });

    // Mobile sign-in toggle
    const signinBtnMobile = document.getElementById('signin-btn-mobile');
    const userAvatarMobile = document.getElementById('user-avatar-mobile');
    
    signinBtnMobile.addEventListener('click', () => {
      signinBtnMobile.classList.add('hidden');
      userAvatarMobile.classList.remove('hidden');
    });
    
    userAvatarMobile.addEventListener('click', () => {
      userAvatarMobile.classList.add('hidden');
      signinBtnMobile.classList.remove('hidden');
    });
    
    userAvatarMobile.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        userAvatarMobile.classList.add('hidden');
        signinBtnMobile.classList.remove('hidden');
      }
    });

    // Theme toggle event listeners
    document.getElementById('theme-toggle-desktop').addEventListener('click', toggleTheme);
    document.getElementById('theme-toggle-mobile').addEventListener('click', toggleTheme);
  </script>
</body>
</html>
