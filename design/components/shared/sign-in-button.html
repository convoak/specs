<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign In Button Component</title>
  
  <!-- Google Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Google Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            zinc: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              300: '#d4d4d8',
              400: '#a1a1aa',
              500: '#71717a',
              600: '#52525b',
              700: '#3f3f46',
              800: '#27272a',
              900: '#18181b',
              950: '#09090b',
            },
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            border: 'hsl(var(--border))',
            ring: 'hsl(var(--ring))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
          },
        },
      },
    }
  </script>
  
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --border: 240 5.9% 90%;
      --ring: 240 5.9% 10%;
    }

    .dark {
      --background: 240 6% 10%;
      --foreground: 0 0% 98%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --border: 240 3.7% 15.9%;
      --ring: 240 4.9% 83.9%;
    }

    body {
      font-family: 'Google Sans', system-ui, sans-serif;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
    }
  </style>
</head>
<body class="antialiased">
  <!-- 
    Sign In Button Component
    ========================
    Primary CTA button for authentication.
    - Triggers OAuth/auth flow on click
    - On successful auth, this button is replaced by user-avatar component
    - Uses shadcn/ui Button styling (primary variant, rounded-full)
    
    React: Map to shadcn/ui <Button> with onClick triggering auth
  -->

  <div class="min-h-screen flex items-center justify-center">
    <div class="text-center space-y-8">
      <h1 class="text-2xl font-medium text-foreground mb-8">Sign In Button Component</h1>
      
      <!-- Sign In Button -->
      <button 
        id="signin-btn"
        class="inline-flex items-center justify-center whitespace-nowrap rounded-full text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2"
      >
        Sign In
      </button>

      <p class="text-sm text-muted-foreground mt-4">
        Click to trigger authentication flow
      </p>

      <!-- Button States Demo -->
      <div class="mt-12 space-y-4">
        <h2 class="text-lg font-medium text-foreground">Button States</h2>
        
        <div class="flex flex-wrap gap-4 justify-center">
          <!-- Default -->
          <div class="text-center">
            <button 
              class="inline-flex items-center justify-center whitespace-nowrap rounded-full text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2"
            >
              Sign In
            </button>
            <p class="text-xs text-muted-foreground mt-2">Default</p>
          </div>
          
          <!-- Disabled -->
          <div class="text-center">
            <button 
              disabled
              class="inline-flex items-center justify-center whitespace-nowrap rounded-full text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2"
            >
              Sign In
            </button>
            <p class="text-xs text-muted-foreground mt-2">Disabled</p>
          </div>
        </div>
      </div>

      <!-- Theme Toggle for Testing -->
      <div class="mt-12 pt-8 border-t border-border">
        <button 
          id="theme-toggle"
          class="text-xs text-muted-foreground hover:text-foreground"
        >
          Toggle dark mode to preview
        </button>
      </div>
    </div>
  </div>

  <script>
    // Theme toggle for testing
    document.getElementById('theme-toggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // Demo click handler
    document.getElementById('signin-btn').addEventListener('click', () => {
      alert('Auth flow would trigger here. On success, replace this button with user-avatar component.');
    });
  </script>
</body>
</html>
