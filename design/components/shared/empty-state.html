<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty State Component</title>
  
  <!-- Google Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Google Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            zinc: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              300: '#d4d4d8',
              400: '#a1a1aa',
              500: '#71717a',
              600: '#52525b',
              700: '#3f3f46',
              800: '#27272a',
              900: '#18181b',
              950: '#09090b',
            },
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
          },
        },
      },
    }
  </script>
  
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
    }
    
    .dark {
      --background: 240 6% 10%;
      --foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
    }
  </style>
</head>
<body class="antialiased bg-background min-h-screen flex items-center justify-center p-4">
  
  <!-- 
    Empty State Component
    =====================
    A reusable empty state display with an SVG illustration and text message.
    
    Features:
    - Centered SVG illustration from /assets/empty-state.svg
    - Muted text message below the illustration
    - Responsive sizing
    - Dark mode support (SVG inverts in dark mode)
    
    React Implementation:
    interface EmptyStateProps {
      message?: string;
    }
    
    export function EmptyState({ message = "Nothing to show" }: EmptyStateProps) {
      return (
        <div className="flex flex-col items-center justify-center py-8">
          <img 
            src="/assets/empty-state.svg" 
            alt="Empty state"
            className="h-24 w-24 dark:invert opacity-50"
          />
          <p className="mt-4 text-sm text-muted-foreground">{message}</p>
        </div>
      );
    }
    
    Usage:
    <EmptyState message="No recent searches" />
  -->
  
  <!-- ========== EMPTY STATE COMPONENT ========== -->
  <div class="empty-state flex flex-col items-center justify-center py-8">
    <!-- Empty State Illustration -->
    <img 
      src="../../assets/empty-state.svg" 
      alt="Empty state illustration"
      class="h-24 w-24 dark:invert opacity-50"
    >
    
    <!-- Empty State Message -->
    <p class="mt-4 text-sm text-muted-foreground">Nothing to show</p>
  </div>
  <!-- ========== END EMPTY STATE COMPONENT ========== -->
  
  
  <!-- Demo: Theme Toggle for Testing -->
  <button 
    onclick="toggleTheme()" 
    class="fixed bottom-4 right-4 px-4 py-2 rounded-full bg-foreground text-background text-sm font-medium"
  >
    Toggle Theme
  </button>
  
  <script>
    // Theme initialization
    function initializeTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    }
    
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      
      if (isDark) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }
    
    initializeTheme();
  </script>
</body>
</html>
